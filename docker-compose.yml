services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audiophile
      POSTGRES_USER: audiophile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost only, for DBeaver/psql; on a server reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiophile -d audiophile"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: audiophile-quiz:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://audiophile:${POSTGRES_PASSWORD}@db:5432/audiophile?sslmode=disable
      DATA_DIR: /data
    volumes:
      - audio:/data          # processed clips (lossless.flac / encoded_<bitrate>.flac)
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
  audio:
